name: Security CI

on:
  pull_request:
  push:
    branches:
      - main
      - development
      - "phase/**"

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx --no-install prisma generate

      - name: Verify TypeScript
        run: npx --no-install tsc --noEmit --incremental false

      - name: Lint
        run: npx --no-install biome lint .

      - name: Run unit security tests
        run: npm run test:unit

      - name: Verify fresh and upgrade migrations
        run: npm run test:migrations

      - name: Run database and route-handler integration tests
        run: npm run test:integration

      - name: Build production application
        run: npm run test:build

      - name: Run production HTTP security tests
        run: npm run test:security:http

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run Playwright security journeys
        run: npm run test:e2e:run

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-security-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
